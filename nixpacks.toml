# The install phase is taken over completely, because the stock one cannot build
# this project on two counts:
#
#   * it has no Python 3.14, and this code cannot run on less — `except A, B:`
#     in app/core/dependencies.py is PEP 758, which 3.13 will not even parse;
#   * it pins uv 0.4.30, which predates the `revision = 3` lockfile format uv
#     0.9 writes, so `uv sync` would fail even once an interpreter was found.
#
# So uv is installed from its own installer at the version that wrote the lock,
# and uv supplies the interpreter itself.
#
# Every path is absolute and under /app on purpose. uv installs to $HOME and
# downloads interpreters under $XDG_DATA_HOME by default, and neither is
# guaranteed to survive into the runtime image — but /app is the application
# itself, so a venv built there still has its Python at boot.

[variables]
UV_INSTALL_DIR = "/app/.uv"
UV_PYTHON_INSTALL_DIR = "/app/.uv-python"
UV_PROJECT_ENVIRONMENT = "/app/.venv"
# The default hardlinks from the uv cache, which lands the interpreter's files
# outside /app and breaks the venv once the cache is gone.
UV_LINK_MODE = "copy"
UV_COMPILE_BYTECODE = "1"
# The installer edits shell profiles by default; nothing here reads one.
INSTALLER_NO_MODIFY_PATH = "1"

[phases.setup]
# `cacert` is not optional — without it the installer's TLS handshake fails.
# `gcc` covers any dependency that has no 3.14 wheel yet and falls back to source.
nixPkgs = ["curl", "cacert", "gcc"]

[phases.install]
cmds = [
  "curl -LsSf https://astral.sh/uv/0.9.18/install.sh | sh",
  "/app/.uv/uv python install 3.14",
  "/app/.uv/uv sync --locked --no-dev",
]

# Nothing to compile: the install phase already produced the environment.
[phases.build]
cmds = []
