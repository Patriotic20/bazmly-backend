# Alembic configuration.
#
# The database URL is deliberately NOT configured here — env.py reads it from
# app.core.config.settings.database.url so there is exactly one source of truth.

[alembic]
script_location = app/alembic

# Date-prefixed revision filenames so `versions/` sorts chronologically.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

prepend_sys_path = .

path_separator = os

truncate_slug_length = 40


[post_write_hooks]
# Lint-fix then format each new revision, so `ruff check` and `ruff format --check`
# still pass straight after `alembic revision`.
hooks = ruff_lint,ruff_format

ruff_lint.type = exec
ruff_lint.executable = ruff
ruff_lint.options = check --fix REVISION_SCRIPT_FILENAME

ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME


# Logging configuration, consumed by env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
